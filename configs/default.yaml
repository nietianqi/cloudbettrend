pre_signal:
  strong_move_ticks: 2
  weak_move_ticks: 1
  consensus_threshold: 0.7
  close_odds_strength_threshold: 1.90
  min_pre_score: 3

reversion:
  strong_reversion_ticks: 2
  weak_reversion_ticks: 1
  prime_window_start: 5
  prime_window_end: 12
  secondary_window_end: 20

state:
  min_dangerous_attacks_ratio_fav: 0.40
  min_shots_diff_fav: -2
  min_shots_on_target_diff_fav: -1
  min_corners_diff_fav: -2
  min_total_shots_for_ou_after_12: 3
  min_total_dangerous_attacks_for_ou_after_12: 20

market_stability:
  min_seconds_since_reopen: 15
  max_line_jumps_last_60s: 2
  max_odds_jumps_last_60s: 2
  require_open_status: true
  min_max_stake: 0.0

edge:
  min_edge_after_cost: 0.03
  strong_edge: 0.04
  medium_edge: 0.02
  default_cost_bps: 20.0

signal:
  minute_start: 3
  minute_end: 25
  require_neutral_score: true
  allow_red_cards: false
  min_total_score: 6

risk:
  initial_bankroll: 100000.0
  max_drawdown_hard: 0.25
  daily_loss_limit: 0.05
  max_consecutive_losses: 6
  max_trades_per_day: 40
  max_stake_pct_of_equity: 0.02
  max_event_exposure_pct: 0.03
  min_stake_pct_of_equity: 0.001
  # Multi-horizon loss limits
  weekly_loss_limit: 0.10
  monthly_loss_limit: 0.20
  # Soft drawdown warning (fires at 15% DD, halves stake cap, hard stop at 25%)
  soft_drawdown_warning: 0.15
  soft_drawdown_stake_scale: 0.50
  # Correlated market protection
  max_same_match_trades: 1
  # Level-specific caps (Level C: 1% equity vs default 2%)
  level_c_max_stake_pct: 0.01

bankroll:
  fractional_kelly: 0.35
  max_fraction_per_bet: 0.02
  min_fraction_per_bet: 0.001
  absolute_min_stake: 0.0
  level_a_multiplier: 1.0
  level_b_multiplier: 0.75
  level_c_multiplier: 0.5
  level_d_multiplier: 0.0
  target_volatility: 0.015
  vol_lookback: 50
  min_vol_samples: 8
  min_vol_scale: 0.5
  max_vol_scale: 1.5
  drawdown_soft_start: 0.1
  drawdown_soft_end: 0.2
  drawdown_min_scale: 0.3
  loss_streak_scale_start: 3
  loss_streak_penalty: 0.85
  # Market-type Kelly fractions
  ah_kelly_scale: 1.0
  ou_kelly_scale: 0.85
  tt_kelly_scale: 0.90
  # Edge uncertainty discount for engine-estimated fair_odds
  estimated_odds_uncertainty_scale: 0.70
  # CLV feedback loop
  clv_feedback_window: 20
  clv_feedback_min_scale: 0.60
  clv_feedback_threshold: -10.0
